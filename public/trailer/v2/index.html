<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conocer a Ignacio — Ignacio Gauna</title>
<meta name="robots" content="noindex">
<meta name="description" content="Tráiler de 90 segundos hecho con Kinetic Studio: cada cuadro y cada sonido se generan en vivo.">
<!-- FONTS: self-hosted (portfolio public/trailer/fonts, no request to Google). Keep in sync with `fonts` in the
     configs. Inside kinetic-studio you can swap this line for the Google Fonts links of any other trailer. -->
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">  <!-- = kinetic-studio trailers/bifurcacion/css/style.css -->
<link rel="stylesheet" href="css/ig.css">
<link rel="stylesheet" href="css/ig-shots.css">
<link rel="stylesheet" href="css/shots/eclipse.css">
<link rel="stylesheet" href="css/shots/handy.css">
<link rel="stylesheet" href="css/shots/lab.css">
<style>html, body, #viewport { background: #0e0e10; }</style>
<!-- GSAP + plugins as classic scripts (copied from node_modules/gsap by scripts/copy-trailer-vendor.mjs) -->
<script src="../vendor/gsap.min.js"></script>
<script src="../vendor/SplitText.min.js"></script>
<script src="../vendor/MorphSVGPlugin.min.js"></script>
<script src="../vendor/DrawSVGPlugin.min.js"></script>
<script src="../vendor/ScrambleTextPlugin.min.js"></script>
</head>
<body>

<div id="viewport">
  <div id="stage">
    <div id="bg"></div>
    <div id="wipe"></div>
    <div id="camera"><canvas id="fx" width="1920" height="1080"></canvas></div>
    <div class="bar" id="bar-top"></div>
    <div class="bar" id="bar-bot"></div>
    <div id="hud" class="mono" aria-hidden="true">
      <i class="crop tl"></i><i class="crop tr"></i><i class="crop bl"></i><i class="crop br"></i>
      <div class="hud-tl"><span class="rec"></span>REC <span class="dim">/</span> <span id="hud-brand"></span></div>
      <div class="hud-tr" id="hud-scene">&nbsp;</div>
      <div class="hud-bl">TC <span id="hud-tc">00:00:00:00</span></div>
      <div class="hud-br">SC <span id="hud-num">00</span>/<span id="hud-total">00</span> <span class="dim">·</span> 24 FPS <span class="dim">·</span> <span id="hud-res">1920×1080</span></div>
    </div>
    <div id="flash"></div>
    <div id="vignette"></div>
    <div id="grain"></div>
  </div>
</div>

<!-- intro / end / ui: used in the hub; hidden in host mode (?host, inside the portfolio) by css/ig.css -->
<div id="intro">
  <a id="intro-back" class="back mono" hidden></a>
  <div class="intro-inner">
    <div class="intro-mark"><i class="m-c"></i><i class="m-s"></i><i class="m-t"></i></div>
    <h1 class="intro-title v" id="intro-title"></h1>
    <p class="intro-sub" id="intro-sub"></p>
    <button id="play" aria-label="Reproducir / Play" disabled><span class="play-ring"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"/></svg></button>
    <p class="intro-state" id="intro-state">…</p>
  </div>
  <p class="intro-keys" id="intro-keys"></p>
</div>
<div id="end"><div class="end-row"><button id="replay">↺</button><a id="end-back" class="end-back" hidden></a></div></div>
<div id="ui"><div id="ui-state" class="mono"></div><div id="progress"><i></i></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
