<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Illustration for the Tuenti card: a prize wheel (gamification), a referral link and a top-up chip.
       Drawn for the portfolio: no screenshot, brand or data of the real product (confidentiality). -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2b50ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2b50ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#eeeae3" fill-opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#0e0e10"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="800" cy="520" r="520" fill="url(#glow)"/>
  <g transform="translate(800 540)">
    <g transform="rotate(-11)">
      <path d="M0 0L0-330A330 330 0 0 1 233.3-233.3Z" fill="#ff4d2e"/>
      <path d="M0 0L233.3-233.3A330 330 0 0 1 330 0Z" fill="#eeeae3"/>
      <path d="M0 0L330 0A330 330 0 0 1 233.3 233.3Z" fill="#2b50ff"/>
      <path d="M0 0L233.3 233.3A330 330 0 0 1 0 330Z" fill="#1d1d22"/>
      <path d="M0 0L0 330A330 330 0 0 1-233.3 233.3Z" fill="#ff4d2e"/>
      <path d="M0 0L-233.3 233.3A330 330 0 0 1-330 0Z" fill="#eeeae3"/>
      <path d="M0 0L-330 0A330 330 0 0 1-233.3-233.3Z" fill="#2b50ff"/>
      <path d="M0 0L-233.3-233.3A330 330 0 0 1 0-330Z" fill="#1d1d22"/>
      <circle r="330" fill="none" stroke="#eeeae3" stroke-width="6"/>
      <g fill="#eeeae3">
        <circle cx="0" cy="-346" r="7"/><circle cx="244.7" cy="-244.7" r="7"/><circle cx="346" cy="0" r="7"/><circle cx="244.7" cy="244.7" r="7"/>
        <circle cx="0" cy="346" r="7"/><circle cx="-244.7" cy="244.7" r="7"/><circle cx="-346" cy="0" r="7"/><circle cx="-244.7" cy="-244.7" r="7"/>
      </g>
    </g>
    <circle r="78" fill="#0e0e10" stroke="#eeeae3" stroke-width="6"/>
    <path d="M-16 -4l12 12 22-24" fill="none" stroke="#ff4d2e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- the pointer -->
  <path d="M800 168l-34-62h68z" fill="#eeeae3"/>
  <!-- referral: two people joined by a link -->
  <g transform="translate(240 300)" fill="none" stroke="#eeeae3" stroke-width="6" stroke-linecap="round">
    <circle cx="0" cy="0" r="34"/><path d="M-58 96c10-40 34-58 58-58s48 18 58 58"/>
    <circle cx="190" cy="40" r="28" stroke="#ff4d2e"/><path d="M142 122c8-32 28-46 48-46s40 14 48 46" stroke="#ff4d2e"/>
    <path d="M52 8C96-6 132 4 160 24" stroke-dasharray="2 16"/>
  </g>
  <!-- top-up chip -->
  <g transform="translate(1210 700)">
    <rect x="0" y="0" width="220" height="96" rx="48" fill="#2b50ff"/>
    <path d="M58 48h52M84 22v52" stroke="#eeeae3" stroke-width="10" stroke-linecap="round"/>
    <path d="M136 30l26 18-26 18" fill="none" stroke="#eeeae3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
