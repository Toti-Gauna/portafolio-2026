name: CI y GitHub Pages

on:
  push:
    branches: [main]
  # Los PR solo verifican (no publican): cada PR muestra un check verde o rojo.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (sin basePath, como en el dominio propio)
        run: npm run build
      - name: Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  pages-build:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    env:
      # GitHub Pages sirve el proyecto bajo /<repo>. Se puede cambiar con variables del repo.
      NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/portafolio-2026' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://toti-gauna.github.io' }}
      # Copia de prueba: no se indexa para no competir con el dominio propio (PAGES_NOINDEX=0 para indexarla).
      NEXT_PUBLIC_NOINDEX: ${{ vars.PAGES_NOINDEX || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
